<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050a16">
<title>Lino le lama — Les Petites Bêtes de la Vallée</title>
<style>
  :root { --nuit: #050a16; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--nuit);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* la hauteur utile reelle sur telephone : barres du navigateur comprises */
  #scene { position: fixed; inset: 0; height: 100dvh; background: var(--nuit); }

  /* DEUX couches : pendant le balayage, la nouvelle page glisse par-dessus
     l'ancienne. Chaque couche reste plein ecran. */
  .couche {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    background-repeat: no-repeat;
    will-change: transform, opacity;
  }
  .couche img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #barre {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.55); pointer-events: none;
    transition: opacity .6s ease; opacity: 0;
  }
  #barre.visible { opacity: 1; }
  #indice {
    position: fixed; left: 50%; bottom: 46%;
    transform: translateX(-50%);
    padding: 10px 20px; border-radius: 999px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    color: #fff; font-size: 13px; letter-spacing: .06em;
    backdrop-filter: blur(6px); pointer-events: none;
    transition: opacity .8s ease; opacity: 1;
  }
  #indice.parti { opacity: 0; }
  #chargement {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--nuit); color: rgba(255,255,255,.75);
    font-size: 14px; letter-spacing: .18em; text-transform: uppercase;
    transition: opacity .5s ease;
  }
  #chargement.parti { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="chargement" class="">Ouverture…</div>
<div id="scene">
  <div class="couche" id="dessous"></div>
  <div class="couche" id="dessus"></div>
</div>
<div id="barre"><span>Lino le lama</span><span id="compteur">1 / 26</span></div>
<div id="indice">Balayez pour tourner la page</div>

<script>
const PAGES = ["images/page-01.jpg?v=febf9710","images/page-02.jpg?v=8993b998","images/page-03.jpg?v=76b3b8fc","images/page-04.jpg?v=ba33dc18","images/page-05.jpg?v=3be2766c","images/page-06.jpg?v=76748fcb","images/page-07.jpg?v=01e31895","images/page-08.jpg?v=42ee1e3d","images/page-09.jpg?v=459e1728","images/page-10.jpg?v=52ee88b9","images/page-11.jpg?v=d9258666","images/page-12.jpg?v=c7096f62","images/page-13.jpg?v=ced47d15","images/page-14.jpg?v=89c8e7e9","images/page-15.jpg?v=18478093","images/page-16.jpg?v=ced8293d","images/page-17.jpg?v=8fffe4b9","images/page-18.jpg?v=ae5bc187","images/page-19.jpg?v=6b198b8e","images/page-20.jpg?v=f93be625","images/page-21.jpg?v=e7793905","images/page-22.jpg?v=59ed639b","images/page-23.jpg?v=115cbeb1","images/page-24.jpg?v=ef28b389","images/page-25.jpg?v=e42b39af","images/page-26.jpg?v=ed6126c6"];
const NUIT = '#050a16';
const scene = document.getElementById('scene');
const dessous = document.getElementById('dessous');
const dessus = document.getElementById('dessus');
const compteur = document.getElementById('compteur');
const barre = document.getElementById('barre');
const indice = document.getElementById('indice');
const chargement = document.getElementById('chargement');

let i = 0;            // page courante
let enMouvement = false;
let chargees = {};    // index -> true quand l'image est prete

function poser(el, k) { el.style.backgroundImage = 'url("' + PAGES[k] + '")'; }

// prechargement : la page suivante et la precedente, sans bloquer l'affichage
function precharger(k) {
  [k + 1, k + 2, k - 1].forEach(function (n) {
    if (n < 0 || n >= PAGES.length || chargees[n]) return;
    const im = new Image();
    im.onload = function () { chargees[n] = true; };
    im.src = PAGES[n];
  });
}

function afficher(k, anime, sens) {
  if (enMouvement) return;
  k = Math.max(0, Math.min(PAGES.length - 1, k));
  if (k === i && chargees[i]) return;
  enMouvement = true;

  const entrant = document.createElement('div');
  entrant.className = 'couche';
  poser(entrant, k);
  const depart = sens > 0 ? 100 : -100;
  entrant.style.transform = 'translateX(' + depart + '%)';
  entrant.style.transition = anime ? 'transform .38s ease-out' : 'none';
  scene.appendChild(entrant);

  const im = new Image();
  im.onload = function () {
    chargees[k] = true;
    chargement.classList.add('parti');
    requestAnimationFrame(function () {
      entrant.style.transform = 'translateX(0)';
      dessus.style.transform = 'translateX(' + (-depart / 3) + '%)';
      setTimeout(function () {
        dessous.style.backgroundImage = dessus.style.backgroundImage;
        dessus.style.transition = 'none';
        dessus.style.transform = 'translateX(0)';
        entrant.remove();
        i = k;
        compteur.textContent = (i + 1) + ' / ' + PAGES.length;
        enMouvement = false;
        precharger(i);
      }, anime ? 400 : 20);
    });
  };
  im.onerror = function () { enMouvement = false; entrant.remove(); };
  im.src = PAGES[k];
}

function montrerBarre() {
  barre.classList.add('visible');
  clearTimeout(window.__t);
  window.__t = setTimeout(function () { barre.classList.remove('visible'); }, 2200);
}

// --- gestes -------------------------------------------------------------
let x0 = null, y0 = null, t0 = 0;
scene.addEventListener('touchstart', function (e) {
  x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  indice.classList.add('parti');
  montrerBarre();
}, { passive: true });
scene.addEventListener('touchend', function (e) {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  const rapide = Date.now() - t0 < 260;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
    afficher(i + (dx < 0 ? 1 : -1), true, dx < 0 ? 1 : -1);
  } else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    // un simple tap : la moitie droite avance, la moitie gauche recule
    afficher(i + (e.changedTouches[0].clientX > window.innerWidth / 2 ? 1 : -1), true,
             e.changedTouches[0].clientX > window.innerWidth / 2 ? 1 : -1);
  } else if (rapide && Math.abs(dx) < 8 && Math.abs(dy) < 8) {
    afficher(i + 1, true, 1);
  }
  x0 = null; y0 = null;
}, { passive: true });

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ') afficher(i + 1, true, 1);
  if (e.key === 'ArrowLeft') afficher(i - 1, true, -1);
});

// --- demarrage ----------------------------------------------------------
poser(dessous, 0);
dessus.style.backgroundImage = 'none';
const premier = new Image();
premier.onload = function () {
  chargees[0] = true;
  chargees[1] = true;
  chargement.classList.add('parti');
  indice.classList.add('parti');
  montrerBarre();
  precharger(0);
};
premier.onerror = function () { chargement.textContent = 'Page introuvable'; };
premier.src = PAGES[0];
setTimeout(function () { indice.classList.add('parti'); }, 4000);
</script>
</body>
</html>
